{%- comment -%}
  Brand head additions. Fonts are self-hosted (assets/fonts) so the site
  makes no third-party requests, matching p2poolv2.org.
{%- endcomment -%}
<link rel="icon" href="{{ '/assets/images/mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/jetbrains-mono-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
<meta name="theme-color" content="#0b0b0c">
